name: Auto-bump cask

# Keeps Casks/flickey.rb pointed at the newest published (non-prerelease)
# release of alfital2/FlicKey. Runs on a schedule so no manual step is needed;
# the FlicKey release script can also fire it instantly via workflow_dispatch.
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: autobump
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bump to the latest FlicKey release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          CASK=Casks/flickey.rb

          TAG=$(gh api repos/alfital2/FlicKey/releases/latest -q .tag_name)
          NEW=${TAG#v}
          CUR=$(sed -nE 's/^  version "(.+)"$/\1/p' "$CASK")
          echo "cask=$CUR  latest=$NEW ($TAG)"

          if [ "$NEW" = "$CUR" ]; then
            echo "Already current, nothing to do."
            exit 0
          fi

          URL="https://github.com/alfital2/FlicKey/releases/download/$TAG/FlicKey.dmg"
          curl -fsSL --retry 3 -o FlicKey.dmg "$URL"
          SHA=$(sha256sum FlicKey.dmg | cut -d' ' -f1)
          rm -f FlicKey.dmg
          echo "sha256=$SHA"

          # Rewrite only the two pinned lines; the url interpolates #{version}.
          sed -i -E "s|^  version \".+\"$|  version \"$NEW\"|" "$CASK"
          sed -i -E "s|^  sha256 \".+\"$|  sha256 \"$SHA\"|" "$CASK"

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$CASK"
          git commit -m "flickey $NEW"
          git push
